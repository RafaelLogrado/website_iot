        <div id="quiz-container" class="container">
            <!-- Tela do Quiz -->
            <div id="quiz">

                <div id="opcoes">
                    <button id="respA" class="opcao" onclick="escolherResp('respA')"></button>
                    <button id="respB" class="opcao" onclick="escolherResp('respB')"></button>
                    <button id="respC" class="opcao" onclick="escolherResp('respC')"></button>
                    <button id="respD" class="opcao" onclick="escolherResp('respD')"></button>
                </div>
            </div>

            <div id="resultado" style="display: none;">
                <h2 id="resultadoFinal"></h2>
                <div id="detalhesResultado"></div>
                <button class="btn-refazer" onclick="location.reload()">Refazer Quiz</button>
